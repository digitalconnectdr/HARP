name: Build HARP Android Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android platform/build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'


      - name: Build debug APK
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Package APK and SHA-256
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/HARP-L2-stage01-debug.apk
          sha256sum dist/HARP-L2-stage01-debug.apk | tee dist/HARP-L2-stage01-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HARP-L2-stage01-debug
          path: |
            dist/HARP-L2-stage01-debug.apk
            dist/HARP-L2-stage01-debug.apk.sha256
          if-no-files-found: error
